<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avengers: Doomsday — What Do You Need to Watch?</title>
<style>
:root{--bg:#0a0a0c;--card:#15151a;--line:#26262e;--tx:#f4f4f6;--mu:#9a9aa6;--red:#e62429;--gold:#f2b632;--blue:#4aa3ff;--grey:#8b8b97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#3a0b0d 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px}
h1{font-family:Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin:8px 0 6px;font-size:clamp(28px,8vw,44px);line-height:1.02}
h1 span{color:var(--red)}
.kicker{color:var(--red);font-size:12px;letter-spacing:.25em;text-transform:uppercase;font-weight:700}
.sub{color:var(--mu);font-size:15px;line-height:1.5;margin:0 0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,10,12,.92);backdrop-filter:blur(8px);padding:10px 0 12px;margin:0 0 6px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin-bottom:8px}
.bar b{color:var(--tx)}
.track{height:5px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#8d1114,var(--red));transition:width .35s}
.link{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
h2.sec{font-family:Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:var(--mu);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .25s,transform .25s;animation:up .4s both}
.card.w{border-color:#2f6b45}.card.n{border-color:#7a1a1d}.card.flash{animation:fl .8s 2}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fl{50%{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,36,41,.35)}}
.t{font-size:17px;font-weight:700;line-height:1.25}
.m{color:var(--mu);font-size:13px;margin:3px 0 12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:46px;border-radius:999px;border:1.5px solid var(--line);background:#1d1d24;color:var(--tx);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn.on.y{background:#1f5d3a;border-color:#3fbf72}
.btn.on.no{background:#6d1417;border-color:var(--red)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.big{display:block;width:100%;max-width:608px;margin:0 auto;min-height:56px;border:0;border-radius:999px;background:var(--red);color:#fff;font:inherit;font-weight:800;letter-spacing:.14em;font-size:16px;cursor:pointer;box-shadow:0 8px 28px rgba(230,36,41,.35);transition:all .25s}
.big.dim{background:#2a2a32;color:var(--mu);box-shadow:none;letter-spacing:.06em;font-weight:700}
.big.ghost{background:transparent;border:1.5px solid var(--red);box-shadow:none;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:28px;font-family:Impact,sans-serif;font-weight:400}
.stat span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.top{border:1px solid var(--red);background:linear-gradient(135deg,#2a0b0d,var(--card));border-radius:16px;padding:16px;margin-bottom:6px}
.top small{color:var(--red);letter-spacing:.2em;font-size:11px;text-transform:uppercase;font-weight:700}
.top div{font-size:21px;font-weight:800;margin-top:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.p-E{color:var(--red);border-color:var(--red);background:rgba(230,36,41,.12)}
.p-V{color:var(--gold);border-color:var(--gold);background:rgba(242,182,50,.12)}
.p-U{color:var(--blue);border-color:var(--blue);background:rgba(74,163,255,.12)}
.p-O{color:var(--grey);border-color:var(--grey);background:rgba(139,139,151,.12)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:12px;margin-bottom:8px;animation:up .4s both}
.item .n{font-family:Impact,sans-serif;color:var(--mu);width:26px;text-align:center}
.item .i{flex:1}.item .i b{display:block;font-size:16px}.item .i span{font-size:12.5px;color:var(--mu)}
.item.E{border-left-color:var(--red)}.item.V{border-left-color:var(--gold)}.item.U{border-left-color:var(--blue)}.item.O{border-left-color:var(--grey)}
.done{text-align:center;padding:40px 10px}.done h2{font-family:Impact,sans-serif;font-weight:400;font-size:38px;margin:0 0 10px;letter-spacing:.04em}
.hide{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:22px 0 4px}
.tabs button{min-height:42px;border:0;border-radius:999px;background:none;color:var(--mu);font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}
.tabs button.on{background:var(--red);color:#fff}
</style></head><body><div class="wrap" id="app"></div>
<script>
const P={E:["ESSENTIAL",0],V:["VERY IMPORTANT",1],U:["USEFUL",2],O:["OPTIONAL",3]};
const D=[
["MCU Foundation",[["Captain America: The First Avenger","Film · 2011","E"],["The Avengers","Film · 2012","E"],["Captain America: The Winter Soldier","Film · 2014","E"],["Avengers: Age of Ultron","Film · 2015","E"],["Captain America: Civil War","Film · 2016","E"],["Thor: Ragnarok","Film · 2017","E"],["Avengers: Infinity War","Film · 2018","E"],["Avengers: Endgame","Film · 2019","E"]]],
["Multiverse / MCU",[["Loki — Season 1","TV · 2021","E"],["Loki — Season 2","TV · 2023","E"],["WandaVision","TV · 2021","V"],["Spider-Man: No Way Home","Film · 2021","V"],["Doctor Strange in the Multiverse of Madness","Film · 2022","E"],["What If...? — Season 1","TV · 2021","U"]]],
["Newer MCU / Current Story",[["Shang-Chi and the Legend of the Ten Rings","Film · 2021","U"],["Black Panther: Wakanda Forever","Film · 2022","V"],["Ant-Man and the Wasp: Quantumania","Film · 2023","V"],["The Marvels","Film · 2023","V"],["Thunderbolts*","Film · 2025","E"]]],
["Fantastic Four",[["The Fantastic Four: First Steps","Film · 2025","E"]]],
["X-Men / Fox Universe",[["X-Men","Film · 2000","E"],["X2: X-Men United","Film · 2003","E"],["X-Men: The Last Stand","Film · 2006","U"],["X-Men: First Class","Film · 2011","V"],["X-Men: Days of Future Past","Film · 2014","E"],["X-Men: Apocalypse","Film · 2016","U"],["X-Men: Dark Phoenix","Film · 2019","U"],["Deadpool","Film · 2016","V"],["Deadpool 2","Film · 2018","V"],["Logan","Film · 2017","V"],["Deadpool & Wolverine","Film · 2024","E"]]]];
const R={"Captain America: The First Avenger":201107,"The Avengers":201205,"Captain America: The Winter Soldier":201404,"Avengers: Age of Ultron":201505,"Captain America: Civil War":201605,"Thor: Ragnarok":201711,"Avengers: Infinity War":201804,"Avengers: Endgame":201904,"Loki — Season 1":202106,"Loki — Season 2":202310,"WandaVision":202101,"Spider-Man: No Way Home":202112,"Doctor Strange in the Multiverse of Madness":202205,"What If...? — Season 1":202108,"Shang-Chi and the Legend of the Ten Rings":202109,"Black Panther: Wakanda Forever":202211,"Ant-Man and the Wasp: Quantumania":202302,"The Marvels":202311,"Thunderbolts*":202505,"The Fantastic Four: First Steps":202507,"X-Men":200007,"X2: X-Men United":200305,"X-Men: The Last Stand":200605,"X-Men: First Class":201106,"X-Men: Days of Future Past":201405,"X-Men: Apocalypse":201605.5,"X-Men: Dark Phoenix":201906,"Deadpool":201602,"Deadpool 2":201805,"Logan":201703,"Deadpool & Wolverine":202407};
const MC=["Captain America: The First Avenger","The Avengers","Captain America: The Winter Soldier","Avengers: Age of Ultron","Captain America: Civil War","Thor: Ragnarok","Avengers: Infinity War","Avengers: Endgame","Loki — Season 1","WandaVision","What If...? — Season 1","Shang-Chi and the Legend of the Ten Rings","Spider-Man: No Way Home","Doctor Strange in the Multiverse of Madness","Black Panther: Wakanda Forever","Ant-Man and the Wasp: Quantumania","Loki — Season 2","The Marvels","Thunderbolts*","The Fantastic Four: First Steps"];
const FX=["X-Men: First Class","X-Men: Days of Future Past","X-Men: Apocalypse","X-Men: Dark Phoenix","X-Men","X2: X-Men United","X-Men: The Last Stand","Deadpool","Deadpool 2","Logan","Deadpool & Wolverine"];
const T=[];D.forEach(([g,l])=>l.forEach(([t,m,p])=>T.push({id:T.length,t,m,p,g,r:R[t]})));
let A={},view="quiz",showW=false,mode="pri";
const $=s=>document.querySelector(s),cnt=()=>Object.keys(A).length;
function quiz(){
 let h=`<div class="kicker">Marvel Studios · Prep Tool</div><h1>Avengers: <span>Doomsday</span><br>What do you need to watch?</h1>
 <p class="sub">Mark every title as watched or not. We'll build a watchlist of what's left, ranked by how much it matters for Doomsday.</p>
 <div class="bar"><div class="row"><span><b id="c">0</b> / ${T.length} completed</span><button class="link" onclick="reset()">Reset quiz</button></div><div class="track"><div class="fill" id="f"></div></div></div>`;
 D.forEach(([g,l])=>{h+=`<h2 class="sec">${g}</h2>`;
  T.filter(x=>x.g==g).forEach(x=>{h+=`<div class="card" id="k${x.id}" style="animation-delay:${(x.id%8)*40}ms"><div class="t">${x.t}</div><div class="m">${x.m}</div>
  <div class="btns"><button class="btn y" onclick="ans(${x.id},1)">✓ Watched</button><button class="btn no" onclick="ans(${x.id},0)">Haven't watched</button></div></div>`})});
 h+=`<div class="cta"><button class="big dim" id="go" onclick="go()"></button></div>`;
 $("#app").innerHTML=h;T.forEach(x=>paint(x.id));prog();
}
function paint(i){const k=$("#k"+i);if(!k)return;const a=A[i];k.className="card"+(a===1?" w":a===0?" n":"");
 k.querySelector(".y").className="btn y"+(a===1?" on":"");k.querySelector(".no").className="btn no"+(a===0?" on":"")}
function prog(){const n=cnt();$("#c").textContent=n;$("#f").style.width=n/T.length*100+"%";
 const b=$("#go");const ok=n==T.length;b.className="big"+(ok?"":" dim");b.textContent=ok?"SHOW MY WATCHLIST":`${T.length-n} TITLES LEFT TO ANSWER`}
function ans(i,v){const fresh=A[i]===undefined;A[i]=v;paint(i);prog();
 if(fresh){const nx=T.find(x=>x.id>i&&A[x.id]===undefined)||T.find(x=>A[x.id]===undefined);
  if(nx)setTimeout(()=>focusCard(nx.id),250)}}
function focusCard(id){const k=$("#k"+id);if(!k)return;
 const y=k.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)-Math.max(110,(innerHeight-k.offsetHeight)/3);
 try{window.scrollTo({top:Math.max(0,y),behavior:"smooth"})}catch(e){window.scrollTo(0,Math.max(0,y))}
 setTimeout(()=>{const r=k.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight)k.scrollIntoView({behavior:"smooth",block:"center"})},500)}
function setMode(m){mode=m;results()}
function go(){if(cnt()<T.length){const x=T.find(x=>A[x.id]===undefined);const k=$("#k"+x.id);focusCard(x.id);k.classList.add("flash");return}
 view="res";showW=false;mode="pri";results();scrollTo(0,0)}
function reset(){A={};view="quiz";quiz();scrollTo(0,0)}
function results(){
 const left=T.filter(x=>A[x.id]===0).sort((a,b)=>P[a.p][1]-P[b.p][1]||a.id-b.id);
 const w=T.filter(x=>A[x.id]===1);
 let h=`<div class="kicker">Marvel Studios · Prep Tool</div><h1>Your Doomsday <span>Watchlist</span></h1>`;
 if(!left.length){h+=`<div class="done"><h2>You're fully caught up.</h2><p class="sub">Every title watched. The multiverse is ready for you — assemble, and see you in the theater for Doomsday. Excelsior!</p></div>`}
 else{
  h+=`<p class="sub" style="font-size:18px;color:var(--tx)">You have <b style="color:var(--red)">${left.length}</b> title${left.length>1?"s":""} left to watch.</p>
  <div class="stats"><div class="stat"><b>${T.length}</b><span>Titles total</span></div><div class="stat"><b style="color:#3fbf72">${w.length}</b><span>Watched</span></div><div class="stat"><b style="color:var(--red)">${left.length}</b><span>Remaining</span></div></div>
  <div class="top"><small>Your highest priority remaining title</small><div>${left[0].t}</div><span class="tag p-${left[0].p}" style="margin-top:10px">${P[left[0].p][0]}</span></div>`;
  h+=`<div class="tabs"><button class="${mode=="pri"?"on":""}" onclick="setMode('pri')">By priority</button><button class="${mode=="chr"?"on":""}" onclick="setMode('chr')">By timeline</button></div>`;
  let n=0;
  if(mode=="chr"){[["MCU · In-universe order",MC],["X-Men / Fox universe · In-universe order",FX]].forEach(([nm,L])=>{
   const l=left.filter(x=>L.includes(x.t)).sort((a,b)=>L.indexOf(a.t)-L.indexOf(b.t));if(!l.length)return;
   h+=`<h2 class="sec">${nm} · ${l.length}</h2>`;
   l.forEach(x=>{n++;h+=`<div class="item ${x.p}" style="animation-delay:${n*35}ms"><div class="n">${n}</div><div class="i"><b>${x.t}</b><span>${x.m} · ${x.g}</span></div><span class="tag p-${x.p}">${P[x.p][0]}</span></div>`})})}
  else Object.keys(P).forEach(p=>{const l=left.filter(x=>x.p==p);if(!l.length)return;
   h+=`<h2 class="sec">${P[p][0]} · ${l.length}</h2>`;
   l.forEach(x=>{n++;h+=`<div class="item ${p}" style="animation-delay:${n*35}ms"><div class="n">${n}</div><div class="i"><b>${x.t}</b><span>${x.m} · ${x.g}</span></div><span class="tag p-${p}">${P[p][0]}</span></div>`})});
 }
 if(w.length){h+=`<div style="text-align:center;margin-top:18px"><button class="link" onclick="showW=!showW;$('#wl').classList.toggle('hide')">Show watched titles (${w.length})</button></div>
  <div id="wl" class="hide" style="margin-top:8px">${w.map(x=>`<div class="item" style="border-left-color:#3fbf72;opacity:.7"><div class="n">✓</div><div class="i"><b>${x.t}</b><span>${x.m}</span></div></div>`).join("")}</div>`}
 h+=`<div style="margin-top:24px"><button class="big" onclick="reset()">START OVER</button><button class="big ghost" onclick="view='quiz';quiz();scrollTo(0,0)">EDIT MY ANSWERS</button></div>`;
 $("#app").innerHTML=h;
}
quiz();
</script></body></html>
